name: Build Docker image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Generate model artifact
        run: |
          pip install uv
          uv run python train.py

      - name: Build Docker image
        run: docker build -t ml-docker-demo .